# 당첨 회차 추가 → JSON → GitHub Pages → FCM draw_data 깨우기
#
# 시크릿(lotto-data 저장소):
#   FIREBASE_SERVICE_ACCOUNT_JSON  Firebase 서비스 계정 JSON 전체
#   FIREBASE_PROJECT_ID            (선택) 예: lotto-wizard-xxxxx

name: Add lotto draw

on:
  workflow_dispatch:
    inputs:
      draw_no:
        description: '회차 (예: 1236)'
        required: true
        type: string
      numbers:
        description: '당첨번호 6개 (예: 3,7,12,21,30,41)'
        required: true
        type: string
      bonus:
        description: '보너스 (예: 15)'
        required: true
        type: string
      skip_fcm:
        description: 'FCM 깨우기 건너뛰기'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  append-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openpyxl google-auth requests

      - name: Append draw (excel → json)
        run: |
          python scripts/add_draw.py \
            --draw-no "${{ inputs.draw_no }}" \
            --numbers "${{ inputs.numbers }}" \
            --bonus "${{ inputs.bonus }}" \
            --repo-root . \
            --version 3

      - name: Commit data files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json draws_v*.json
          git add ./*.xlsx || true
          git reset -- './~$'*.xlsx 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "data: add draw ${{ inputs.draw_no }}"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp "draws_v3.json" "manifest.json" dist/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: FCM draw_data ping
        if: ${{ inputs.skip_fcm != true }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          python scripts/send_fcm_draw_data.py \
            --draw-no "${{ inputs.draw_no }}" \
            --allow-missing-secret
