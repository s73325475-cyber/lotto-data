# 이미 반영된 회차 번호 수정 → JSON → GitHub Pages → (선택) FCM
# 모바일 GitHub: Actions → Fix lotto draw → Run workflow
#
# 기존 Add lotto draw 는 변경하지 않습니다. (추가 전용)

name: Fix lotto draw

on:
  workflow_dispatch:
    inputs:
      draw_no:
        description: '수정할 회차 (예: 1242)'
        required: true
        type: string
      numbers:
        description: '올바른 당첨번호 6개 (예: 3,7,12,21,30,41)'
        required: true
        type: string
      bonus:
        description: '올바른 보너스 (예: 15)'
        required: true
        type: string
      confirm:
        description: '실수 방지: FIX 라고 입력'
        required: true
        type: string
      skip_fcm:
        description: 'FCM 깨우기 건너뛰기 (기본 권장: true)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm FIX
        run: |
          if [ "${{ inputs.confirm }}" != "FIX" ]; then
            echo "::error::confirm 칸에 FIX 를 입력해야 실행됩니다 (현재: ${{ inputs.confirm }})"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install openpyxl google-auth requests

      - name: Fix draw (excel → json)
        run: |
          python scripts/fix_draw.py \
            --draw-no "${{ inputs.draw_no }}" \
            --numbers "${{ inputs.numbers }}" \
            --bonus "${{ inputs.bonus }}" \
            --repo-root . \
            --version 3

      - name: Commit data files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json draws_v*.json
          git add ./*.xlsx || true
          git reset -- './~$'*.xlsx 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit (번호가 이미 동일할 수 있음)"
            exit 1
          fi
          git commit -m "data: fix draw ${{ inputs.draw_no }}"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp "draws_v3.json" "manifest.json" dist/
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: FCM draw_data ping
        if: ${{ inputs.skip_fcm != true }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          python scripts/send_fcm_draw_data.py \
            --draw-no "${{ inputs.draw_no }}" \
            --allow-missing-secret
