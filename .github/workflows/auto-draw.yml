# Auto draw — 조회 전용 (apply OFF)
#
# 안전:
# - Add lotto draw / Fix lotto draw 워크플로·스크립트를 수정·호출하지 않음
# - 엑셀 / draws_v3 운영 반영 / Pages / FCM 없음
# - 성공 시 auto-draw/data 조회 이력만 커밋 (검증용)
#
# 동작:
# - 토 20:45 KST cron 기동 → 5분 간격 재조회 → 번호 확보 시 중단
# - 목표 회차는 날짜로 계산 (Add가 먼저 실행돼도 같은 회차를 조회)
# - GitHub 예약 실행은 누락될 수 있어 백업 cron을 둠. 이미 기록된 회차면 즉시 종료
# - Job Summary에 가져온 번호 + 수동 입력 대조 표시, FETCH_HISTORY.md 누적

name: Auto draw (fetch only)

on:
  schedule:
    # 모두 UTC. 정각 부하를 피해 :47 사용
    - cron: "45 11 * * 6"   # 토 20:45 KST (주 실행)
    - cron: "47 12 * * 6"   # 토 21:47 KST (백업)
    - cron: "47 13 * * 6"   # 토 22:47 KST (백업, 추첨 지연 대비)
    - cron: "47 14 * * 6"   # 토 23:47 KST (백업)
    - cron: "17 0 * * 0"    # 일 09:17 KST (최종 보정)
  workflow_dispatch:
    inputs:
      draw_no:
        description: "조회 회차 (비우면 최근 토요일 회차)"
        required: false
        type: string
        default: ""
      interval_minutes:
        description: "재시도 간격(분)"
        required: false
        type: string
        default: "5"
      max_attempts:
        description: "최대 시도 (5분×48 ≈ 4시간)"
        required: false
        type: string
        default: "48"
      once:
        description: "true면 1회만 조회 (디버그)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# pages 그룹과 분리 — 수동 Add/Fix 배포와 충돌 방지
concurrency:
  group: auto-draw-fetch
  cancel-in-progress: false

jobs:
  fetch-only:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.run.outputs.outcome }}
      draw_no: ${{ steps.run.outputs.draw_no }}
      numbers: ${{ steps.run.outputs.numbers }}
      bonus: ${{ steps.run.outputs.bonus }}
      history_updated: ${{ steps.run.outputs.history_updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch with 5-minute retries
        id: run
        env:
          DRAW_NO: ${{ inputs.draw_no || '' }}
          INTERVAL: ${{ inputs.interval_minutes || '5' }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '48' }}
          ONCE: ${{ inputs.once || false }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "${ONCE}" = "true" ]; then
            EXTRA+=(--once)
          fi
          if [ -n "${DRAW_NO}" ]; then
            EXTRA+=(--draw-no "${DRAW_NO}")
          fi
          set +e
          python auto-draw/scripts/auto_draw_run.py \
            --draws draws_v3.json \
            --history auto-draw/data/fetch_history.json \
            --history-md auto-draw/data/FETCH_HISTORY.md \
            --interval-minutes "${INTERVAL}" \
            --max-attempts "${MAX_ATTEMPTS}" \
            "${EXTRA[@]}"
          CODE=$?
          set -e
          echo "runner_exit=${CODE}"
          # 0 = ready or not_published skip / 3 = api_error
          if [ "$CODE" -eq 3 ]; then
            echo "outcome=api_error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" -ne 0 ]; then
            echo "outcome=runner_error" >> "$GITHUB_OUTPUT"
            exit "$CODE"
          fi
          # outputs already appended by python when GITHUB_OUTPUT set;
          # ensure defaults if python skipped outputs
          if ! grep -q '^outcome=' "$GITHUB_OUTPUT" 2>/dev/null; then
            echo "outcome=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fetch history (verification only)
        if: steps.run.outputs.history_updated == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-draw/data/fetch_history.json auto-draw/data/FETCH_HISTORY.md
          if git diff --staged --quiet; then
            echo "History unchanged"
            exit 0
          fi
          DRAW="${{ steps.run.outputs.draw_no }}"
          git commit -m "auto-draw: record fetch ${DRAW} (verification only)"
          # Add/Fix 가 같은 시각에 main 을 밀어올리면 non-FF 가 날 수 있음 → rebase 후 재시도
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "History pushed (attempt $i)"
              exit 0
            fi
            echo "Push conflict, retry $i ..."
            sleep 5
          done
          echo "::error::history commit push failed after retries (Add/Fix 데이터는 영향 없음)"
          exit 1

  notify-on-api-error:
    needs: fetch-only
    if: needs.fetch-only.outputs.outcome == 'api_error'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify developer (manual Add/Fix fallback)
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[auto-draw] 조회 실패 — 수동 Add lotto draw 필요';
            const body = [
              '## Auto draw 조회 실패 (apply OFF)',
              '',
              '동행복권 API 조회가 실패했습니다. **엑셀/Pages는 변경되지 않았습니다.**',
              '',
              '### 폴백 (모바일 GitHub)',
              '1. Actions → **Add lotto draw** — 새 회차 입력',
              '2. 이미 잘못된 회차가 있다면 → **Fix lotto draw** (`confirm`에 `FIX`)',
              '',
              '수동 Add/Fix 워크플로는 그대로입니다.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
